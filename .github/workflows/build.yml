name: NOVA Android 17 V6

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Clean legacy V2/V3/V4 sources
        run: |
          find app/src -type f -name '*.kt' -delete
          rm -rf app/src/main/res
          echo 'Remaining source files:'
          find app/src/main -type f -print | sort

      - name: Build debug APK
        run: gradle --no-daemon --no-configuration-cache clean assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Dynamic-Spot-V6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
